<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="560" viewBox="0 0 1000 560"><title>手牌牌面解剖（2 倍放大）</title><defs>
<style>@font-face{font-family:"jf-openhuninn";src:url("../../../game/public/fonts/jf-openhuninn-2.1.woff2") format("woff2");}
.h{font-family:"jf-openhuninn","Noto Sans CJK TC","Noto Sans TC",sans-serif}
.t{font-family:"Noto Serif CJK TC","Noto Serif TC",serif;font-weight:700}
.s{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif}</style>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
<filter id="roughBig" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.19  0 0 0 0 0.17  0 0 0 0.09 0"/></filter>
<filter id="sepia"><feColorMatrix type="matrix" values="0.36 0.45 0.12 0 0  0.31 0.40 0.10 0 0  0.25 0.32 0.08 0 0  0 0 0 1 0"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a3229" flood-opacity="0.22"/></filter>
<filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="1" dy="6" stdDeviation="4" flood-color="#1d1915" flood-opacity="0.42"/></filter>
<pattern id="cloth" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 5h10M5 0v10" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.4"/><circle cx="5" cy="5" r="1.3" fill="#ffffff" fill-opacity="0.12"/></pattern>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 4h8" stroke="#66615A" stroke-opacity="0.28" stroke-width="1.5"/></pattern>
<pattern id="lines" width="10" height="26" patternUnits="userSpaceOnUse"><path d="M0 25.5h10" stroke="#A9C4D9" stroke-opacity="0.45" stroke-width="1"/></pattern>
</defs><rect width="1000" height="560" fill="#EDEFE8"/><text x="24" y="40" class="t" font-size="22" fill="#33302B">手牌牌面解剖（畫面 2 倍放大）</text><g transform="translate(30,80) scale(2)"><g transform="rotate(0 44.0 138)"><g filter="url(#shadow)"><rect x="0" y="10" width="88" height="128" rx="7" fill="#FBFAF6"/></g><rect x="0" y="10" width="88" height="128" rx="7" fill="none" stroke="#C25A80" stroke-width="2.6" filter="url(#rough)"/><clipPath id="ac101"><rect x="5" y="15" width="78" height="56" rx="4"/></clipPath><rect x="5" y="15" width="78" height="56" rx="4" fill="#F2E2E4"/><image href="../../deck/s_love.jpg" x="-4.359999999999999" y="15" width="96.72" height="56" preserveAspectRatio="xMidYMid slice" clip-path="url(#ac101)"/><text x="7" y="88" class="h" font-size="13" font-weight="700" fill="#33302B">戀愛</text><path d="M6 92q26.4 3 30 -1" stroke="#C25A80" stroke-width="3" opacity=".55" fill="none" stroke-linecap="round"/><g filter="url(#rough)"><circle cx="77" cy="127" r="5.2" fill="#E8D29B" stroke="#C25A80" stroke-width="2"/><path d="M77 127V123.88M77 127L79.34 128.04" stroke="#C25A80" stroke-width="2" stroke-linecap="round"/><path d="M74.14 120.3l-2 -2M79.86 120.3l2 -2" stroke="#C25A80" stroke-width="1.8" stroke-linecap="round"/></g><path d="M8 121h8l-8 10h8z" fill="none" stroke="#C25A80" stroke-width="1.6" filter="url(#rough)"/></g></g><g transform="translate(530,70) scale(2)"><g transform="rotate(0 44.0 144)"><g filter="url(#rough)"><path d="M40.0 22c-10 -4 -18 -14 -12 -18c5 -3 10 4 12 12z" fill="#433A2E" stroke="#27211B" stroke-width="1.8"/><path d="M48.0 22c10 -4 18 -14 12 -18c-5 -3 -10 4 -12 12z" fill="#433A2E" stroke="#27211B" stroke-width="1.8"/></g><g filter="url(#shadowHeavy)"><rect x="0" y="16" width="88" height="128" rx="9" fill="#433A2E"/></g><rect x="0" y="16" width="88" height="128" rx="9" fill="url(#cloth)"/><rect x="0" y="16" width="88" height="128" rx="9" fill="none" stroke="#27211B" stroke-width="4.5" filter="url(#rough)"/><rect x="4.5" y="20.5" width="79" height="119" rx="6" fill="none" stroke="#EDEBE3" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="44.0" cy="21" r="6" fill="#433A2E" stroke="#27211B" stroke-width="2" filter="url(#rough)"/><clipPath id="bc201"><rect x="6" y="28" width="76" height="47" rx="3"/></clipPath><rect x="6" y="28" width="76" height="47" rx="3" fill="#EDEBE3"/><image href="../../deck/b_bill.jpg" x="-3.119999999999999" y="28" width="94.24" height="47" preserveAspectRatio="xMidYMid slice" clip-path="url(#bc201)" filter="url(#sepia)"/><text x="8" y="91" class="h" font-size="12" font-weight="700" fill="#EDEBE3">家裡的</text><text x="8" y="105" class="h" font-size="12" font-weight="700" fill="#EDEBE3">帳單</text><g transform="rotate(-12 20 39)" filter="url(#rough)"><rect x="7" y="30" width="26" height="18" rx="3" fill="#FBFAF6" fill-opacity=".9" stroke="#C8322E" stroke-width="2"/><text x="20" y="43" text-anchor="middle" class="t" font-size="10" fill="#C8322E">包袱</text></g><path d="M9.0 134q9.0 -2.55 16.0 0" stroke="#2A2522" stroke-width="2.72" fill="none" stroke-linecap="round" stroke-dasharray="2 2"/><circle cx="26.0" cy="134" r="1.785" fill="#2A2522"/><path d="M27.0 134q9.0 -2.55 16.0 0" stroke="#2A2522" stroke-width="2.72" fill="none" stroke-linecap="round" stroke-dasharray="2 2"/><circle cx="44.0" cy="134" r="1.785" fill="#2A2522"/><path d="M45.0 134q9.0 -2.55 16.0 0" stroke="#2A2522" stroke-width="2.72" fill="none" stroke-linecap="round" stroke-dasharray="2 2"/><circle cx="62.0" cy="134" r="1.785" fill="#2A2522"/><path d="M63.0 134q9.0 -2.55 16.0 0" stroke="#D9B77A" stroke-width="2.72" fill="none" stroke-linecap="round" /><g><circle cx="62.0" cy="134" r="3.9099999999999997" fill="#F2B85A" opacity=".55"/><path d="M62.0 128.9l1.36 3.8249999999999997l2.8899999999999997 -1l-2.04 2.55l2.21 2.55l-3.4 -1.4l-1.02 3.06l-1.02 -3.06l-3.4 1.4l2.21 -2.55l-2.04 -2.55l2.8899999999999997 1z" fill="#D2452F"/></g></g></g><text x="30" y="72" class="h" font-size="13" fill="#33302B" opacity=".9">一般手牌 88×128（375 寬：74×108）</text><text x="225" y="110" class="h" font-size="13" fill="#8A5BA8" opacity=".9">① 圖窗：寬−10，高＝(寬−10)×0.72</text><text x="225" y="132" class="h" font-size="13" fill="#8A5BA8" opacity=".9">   16:9 原圖置中裁切（cover，左右放大 12%）</text><text x="225" y="200" class="h" font-size="13" fill="#8A5BA8" opacity=".9">② 名字：粉圓 13px 粗，最多兩行</text><text x="225" y="222" class="h" font-size="13" fill="#8A5BA8" opacity=".9">③ 主色蠟筆底線＝這張牌的 accent</text><text x="225" y="262" class="h" font-size="13" fill="#8A5BA8" opacity=".9">④ 外框 2.6px＝accent，手繪抖動</text><text x="225" y="316" class="h" font-size="13" fill="#8A5BA8" opacity=".9">⑤ 右下：時鐘＝時間成本（個數）</text><text x="225" y="338" class="h" font-size="13" fill="#8A5BA8" opacity=".9">⑥ 左下沙漏＝會過期（不寫幾歲）</text><text x="530" y="56" class="h" font-size="13" fill="#33302B" opacity=".9">包袱牌：同尺寸，視覺重量加倍</text><text x="725" y="100" class="h" font-size="13" fill="#8A5BA8" opacity=".9">a 布耳打結：凸出牌頂約 14px</text><text x="725" y="122" class="h" font-size="13" fill="#8A5BA8" opacity=".9">b 布紋底＝accent×0.55</text><text x="725" y="144" class="h" font-size="13" fill="#8A5BA8" opacity=".9">   深邊＝accent×0.32，粗 4.5px</text><text x="725" y="166" class="h" font-size="13" fill="#8A5BA8" opacity=".9">c 內縫線：粉筆白虛線</text><text x="725" y="206" class="h" font-size="13" fill="#8A5BA8" opacity=".9">d 印章「包袱」放左上（扇形裡</text><text x="725" y="228" class="h" font-size="13" fill="#8A5BA8" opacity=".9">   左半邊永遠看得到），斜 12°</text><text x="725" y="262" class="h" font-size="13" fill="#8A5BA8" opacity=".9">e 圖窗褪成舊照片色（sepia）</text><text x="725" y="312" class="h" font-size="13" fill="#8A5BA8" opacity=".9">f 名字粉筆白，三字斷行</text><text x="725" y="352" class="h" font-size="13" fill="#8A5BA8" opacity=".9">g 引信：段數＝放多久會爆</text><text x="725" y="374" class="h" font-size="13" fill="#8A5BA8" opacity=".9">   燒黑＝已背的學期，火星＝現在</text><text x="725" y="396" class="h" font-size="13" fill="#8A5BA8" opacity=".9">   燒完 → 觸發事件牌</text><text x="725" y="430" class="h" font-size="13" fill="#8A5BA8" opacity=".9">h 陰影更重，在手牌裡下沉 6px</text><text x="725" y="452" class="h" font-size="13" fill="#8A5BA8" opacity=".9">i 每學期痛一次：牌晃一下＋便條旁白</text><text x="24" y="506" class="h" font-size="14" fill="#66615A" opacity=".9">不寫任何數字：成本＝時鐘個數、過期＝沙漏、背多久＝引信燒到哪。點開才看全文。</text><text x="24" y="532" class="h" font-size="14" fill="#66615A" opacity=".9">主色：每張牌自己的 accent（data/deck/cards.json），只用在外框、底線、選取光暈、詳情按鈕，不整張塗滿。</text><rect width="1000" height="560" filter="url(#paper)" pointer-events="none"/></svg>