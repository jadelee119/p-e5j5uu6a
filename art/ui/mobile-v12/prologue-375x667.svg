<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="375" height="667" viewBox="0 0 375 667"><title>童年序章：三選一 375x667</title><defs>
<style>@font-face{font-family:"jf-openhuninn";src:url("../../../game/public/fonts/jf-openhuninn-2.1.woff2") format("woff2");}
.h{font-family:"jf-openhuninn","Noto Sans CJK TC","Noto Sans TC",sans-serif}
.t{font-family:"Noto Serif CJK TC","Noto Serif TC",serif;font-weight:700}
.s{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif}</style>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
<filter id="roughBig" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.19  0 0 0 0 0.17  0 0 0 0.09 0"/></filter>
<filter id="sepia"><feColorMatrix type="matrix" values="0.36 0.45 0.12 0 0  0.31 0.40 0.10 0 0  0.25 0.32 0.08 0 0  0 0 0 1 0"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a3229" flood-opacity="0.22"/></filter>
<filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="1" dy="6" stdDeviation="4" flood-color="#1d1915" flood-opacity="0.42"/></filter>
<pattern id="cloth" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 5h10M5 0v10" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.4"/><circle cx="5" cy="5" r="1.3" fill="#ffffff" fill-opacity="0.12"/></pattern>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 4h8" stroke="#66615A" stroke-opacity="0.28" stroke-width="1.5"/></pattern>
<pattern id="lines" width="10" height="26" patternUnits="userSpaceOnUse"><path d="M0 25.5h10" stroke="#A9C4D9" stroke-opacity="0.45" stroke-width="1"/></pattern>
</defs><rect width="375" height="667" fill="#EDEFE8"/><g filter="url(#shadow)"><rect x="10" y="32" width="355" height="50" rx="10" fill="#2F4A3E"/></g><text x="26" y="64.0" class="t" font-size="18" fill="#EDEBE3">童年・剛上小學</text><circle cx="295" cy="57.0" r="7" fill="#E8D29B" stroke="#EDEBE3" stroke-width="1.6" filter="url(#rough)"/><circle cx="317" cy="57.0" r="7" fill="none" stroke="#EDEBE3" stroke-width="1.6" filter="url(#rough)"/><circle cx="339" cy="57.0" r="7" fill="none" stroke="#EDEBE3" stroke-width="1.6" filter="url(#rough)"/><text x="187.5" y="106" text-anchor="middle" class="h" font-size="16" fill="#33302B">那時候，你最常在做什麼？</text><text x="187.5" y="128" text-anchor="middle" class="h" font-size="12.5" fill="#66615A">挑你最記得的那件事，它會變成以後抽得到的牌。</text><g transform="rotate(-1.2 187.5 206.0)"><g filter="url(#shadow)"><rect x="12" y="144" width="351" height="124" rx="8" fill="#FBFAF6"/></g><rect x="12" y="144" width="351" height="124" rx="8" fill="none" stroke="#3A6FB0" stroke-width="2.4" filter="url(#rough)"/><rect x="21" y="153" width="72" height="84" rx="4" fill="#D0DBE6"/><rect x="21" y="153" width="72" height="84" rx="4" fill="url(#hatch)" opacity=".7"/><rect x="24" y="156" width="66" height="78" rx="3" fill="none" stroke="#3A6FB0" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough)"/><g opacity=".55" filter="url(#rough)"><circle cx="57.0" cy="183.24" r="11.760000000000002" fill="#FBFAF6" stroke="#3A6FB0" stroke-width="1.6"/><path d="M38.519999999999996 216.84q18.48 -26.88 36.96 0" fill="#FBFAF6" stroke="#3A6FB0" stroke-width="1.6"/></g><text x="57.0" y="230" text-anchor="middle" class="h" font-size="9" fill="#284D7B">插圖待補</text><rect x="41.0" y="146" width="32" height="11" fill="#E8D29B" opacity=".85" transform="rotate(-6 57.0 150)"/><text x="57.0" y="255" text-anchor="middle" class="h" font-size="10" fill="#2B5384">＋讀書</text><g filter="url(#rough)"><circle cx="114" cy="164" r="11" fill="#D4DEE8" stroke="#3A6FB0" stroke-width="1.4"/></g><g transform="translate(107,157) scale(.58)" fill="none" stroke="#2E588C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6c3-1.5 6-1.2 9 .6 3-1.8 6-2.1 9-.6v12c-3-1.4-6-1.1-9 .6-3-1.7-6-2-9-.6z"/><path d="M12 6.6v12"/></g><text x="131" y="170" class="t" font-size="15" fill="#33302B">先寫功課</text><text x="103" y="193.8" class="s" font-size="12.5" fill="#33302B">卡通的片頭曲都響了，你的數學習作還剩最後</text><text x="103" y="211.9" class="s" font-size="12.5" fill="#33302B">一題。</text><path d="M103 220.875h250" stroke="#3A6FB0" stroke-width="1.3" stroke-dasharray="4 3" opacity=".6"/><path d="M104 230.35000000000002v5.75q0 3 3 3h5l-2 -2m2 2l-2 2" stroke="#3A6FB0" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="117" y="239.6" class="h" font-size="11.5" fill="#5B646F">你學會先把該做的做完；代價是每部卡通都從</text><text x="117" y="256.2" class="h" font-size="11.5" fill="#5B646F">中間開始看。</text></g><g transform="rotate(0.8 185.5 336.0)"><rect x="5" y="269" width="361" height="134" rx="12" fill="#A8322D" opacity=".26"/><g filter="url(#shadow)"><rect x="10" y="274" width="351" height="124" rx="8" fill="#FBFAF6"/></g><rect x="10" y="274" width="351" height="124" rx="8" fill="none" stroke="#A8322D" stroke-width="3.4" filter="url(#rough)"/><rect x="19" y="283" width="72" height="84" rx="4" fill="#E8CEC9"/><rect x="19" y="283" width="72" height="84" rx="4" fill="url(#hatch)" opacity=".7"/><rect x="22" y="286" width="66" height="78" rx="3" fill="none" stroke="#A8322D" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough)"/><g opacity=".55" filter="url(#rough)"><circle cx="55.0" cy="313.24" r="11.760000000000002" fill="#FBFAF6" stroke="#A8322D" stroke-width="1.6"/><path d="M36.519999999999996 346.84000000000003q18.48 -26.88 36.96 0" fill="#FBFAF6" stroke="#A8322D" stroke-width="1.6"/></g><text x="55.0" y="360" text-anchor="middle" class="h" font-size="9" fill="#75231F">插圖待補</text><rect x="39.0" y="276" width="32" height="11" fill="#E8D29B" opacity=".85" transform="rotate(-6 55.0 280)"/><text x="55.0" y="385" text-anchor="middle" class="h" font-size="10" fill="#7E2521">＋大隊接力</text><g filter="url(#rough)"><circle cx="112" cy="294" r="11" fill="#EAD2CD" stroke="#A8322D" stroke-width="1.4"/></g><g transform="translate(105,287) scale(.58)" fill="none" stroke="#862824" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-7h5l3 7M10 9l2 7h6M9 6h3"/></g><text x="129" y="300" class="t" font-size="15" fill="#33302B">拆掉輔助輪</text><text x="101" y="323.8" class="s" font-size="12.5" fill="#33302B">拆掉輔助輪那天你摔了好幾次，紅藥水沒乾又</text><text x="101" y="341.9" class="s" font-size="12.5" fill="#33302B">牽車出門。</text><path d="M101 350.875h250" stroke="#A8322D" stroke-width="1.3" stroke-dasharray="4 3" opacity=".6"/><path d="M102 360.35v5.75q0 3 3 3h5l-2 -2m2 2l-2 2" stroke="#A8322D" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="115" y="369.6" class="h" font-size="11.5" fill="#76554E">你不太怕跌倒，身體也比較跟得上你想做的事。</text><g filter="url(#rough)"><circle cx="347" cy="288" r="11" fill="#A8322D"/><path d="M342 288l4 4l7 -8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></g></g><g transform="rotate(-0.6 187.5 474.0)"><g filter="url(#shadow)"><rect x="12" y="412" width="351" height="124" rx="8" fill="#FBFAF6"/></g><rect x="12" y="412" width="351" height="124" rx="8" fill="none" stroke="#B8902F" stroke-width="2.4" filter="url(#rough)"/><rect x="21" y="421" width="72" height="84" rx="4" fill="#ECE2CA"/><rect x="21" y="421" width="72" height="84" rx="4" fill="url(#hatch)" opacity=".7"/><rect x="24" y="424" width="66" height="78" rx="3" fill="none" stroke="#B8902F" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough)"/><g opacity=".55" filter="url(#rough)"><circle cx="57.0" cy="451.24" r="11.760000000000002" fill="#FBFAF6" stroke="#B8902F" stroke-width="1.6"/><path d="M38.519999999999996 484.84000000000003q18.48 -26.88 36.96 0" fill="#FBFAF6" stroke="#B8902F" stroke-width="1.6"/></g><text x="57.0" y="498" text-anchor="middle" class="h" font-size="9" fill="#806420">插圖待補</text><rect x="41.0" y="414" width="32" height="11" fill="#E8D29B" opacity=".85" transform="rotate(-6 57.0 418)"/><text x="57.0" y="523" text-anchor="middle" class="h" font-size="10" fill="#8A6C23">＋顧店</text><g filter="url(#rough)"><circle cx="114" cy="432" r="11" fill="#EDE4CE" stroke="#B8902F" stroke-width="1.4"/></g><g transform="translate(107,425) scale(.58)" fill="none" stroke="#937325" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l2-5h14l2 5"/><path d="M3 10c0 1.7 1.3 2.5 3 2.5S9 11.7 9 10c0 1.7 1.3 2.5 3 2.5s3-.8 3-2.5c0 1.7 1.3 2.5 3 2.5s3-.8 3-2.5"/><path d="M5 12.5V20h14v-7.5M10 20v-4h4v4"/></g><text x="131" y="438" class="t" font-size="15" fill="#33302B">店裡的小板凳</text><text x="103" y="461.8" class="s" font-size="12.5" fill="#33302B">放學就坐在店裡的小板凳，客人進門你比大人</text><text x="103" y="479.9" class="s" font-size="12.5" fill="#33302B">先喊歡迎。</text><path d="M103 488.875h250" stroke="#B8902F" stroke-width="1.3" stroke-dasharray="4 3" opacity=".6"/><path d="M104 498.35v5.75q0 3 3 3h5l-2 -2m2 2l-2 2" stroke="#B8902F" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="117" y="507.6" class="h" font-size="11.5" fill="#7A6C4F">你比同年紀早學會看場合、算零錢；自己玩的</text><text x="117" y="524.2" class="h" font-size="11.5" fill="#7A6C4F">時間少一點。</text></g><g filter="url(#shadow)"><rect x="12" y="603" width="351" height="54" rx="10" fill="#A8322D"/></g><rect x="15" y="606" width="345" height="48" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity=".25" stroke-dasharray="5 4" filter="url(#rough)"/><text x="187.5" y="636.48" text-anchor="middle" class="h" font-size="18" fill="#FFFFFF">就是這個</text><rect width="375" height="667" filter="url(#paper)" pointer-events="none"/><rect width="375" height="20" fill="url(#hatch)"/><text x="187.5" y="15.0" text-anchor="middle" class="s" font-size="11" fill="#66615A">安全區（瀏海／狀態列）</text></svg>