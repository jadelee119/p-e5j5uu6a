<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844"><title>童年序章：三選一 390x844</title><defs>
<style>@font-face{font-family:"jf-openhuninn";src:url("../../../game/public/fonts/jf-openhuninn-2.1.woff2") format("woff2");}
.h{font-family:"jf-openhuninn","Noto Sans CJK TC","Noto Sans TC",sans-serif}
.t{font-family:"Noto Serif CJK TC","Noto Serif TC",serif;font-weight:700}
.s{font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif}</style>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
<filter id="roughBig" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
<filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.19  0 0 0 0 0.17  0 0 0 0.09 0"/></filter>
<filter id="sepia"><feColorMatrix type="matrix" values="0.36 0.45 0.12 0 0  0.31 0.40 0.10 0 0  0.25 0.32 0.08 0 0  0 0 0 1 0"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a3229" flood-opacity="0.22"/></filter>
<filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="1" dy="6" stdDeviation="4" flood-color="#1d1915" flood-opacity="0.42"/></filter>
<pattern id="cloth" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 5h10M5 0v10" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.4"/><circle cx="5" cy="5" r="1.3" fill="#ffffff" fill-opacity="0.12"/></pattern>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 4h8" stroke="#66615A" stroke-opacity="0.28" stroke-width="1.5"/></pattern>
<pattern id="lines" width="10" height="26" patternUnits="userSpaceOnUse"><path d="M0 25.5h10" stroke="#A9C4D9" stroke-opacity="0.45" stroke-width="1"/></pattern>
</defs><rect width="390" height="844" fill="#EDEFE8"/><g filter="url(#shadow)"><rect x="10" y="59" width="370" height="60" rx="10" fill="#2F4A3E"/></g><text x="26" y="96.0" class="t" font-size="20" fill="#EDEBE3">童年・剛上小學</text><circle cx="310" cy="89.0" r="7" fill="#E8D29B" stroke="#EDEBE3" stroke-width="1.6" filter="url(#rough)"/><circle cx="332" cy="89.0" r="7" fill="none" stroke="#EDEBE3" stroke-width="1.6" filter="url(#rough)"/><circle cx="354" cy="89.0" r="7" fill="none" stroke="#EDEBE3" stroke-width="1.6" filter="url(#rough)"/><text x="195.0" y="149" text-anchor="middle" class="h" font-size="17" fill="#33302B">那時候，你最常在做什麼？</text><text x="195.0" y="171" text-anchor="middle" class="h" font-size="12.5" fill="#66615A">挑你最記得的那件事，它會變成以後抽得到的牌。</text><g transform="rotate(-1.2 195.0 272.0)"><g filter="url(#shadow)"><rect x="12" y="197" width="366" height="150" rx="8" fill="#FBFAF6"/></g><rect x="12" y="197" width="366" height="150" rx="8" fill="none" stroke="#3A6FB0" stroke-width="2.4" filter="url(#rough)"/><rect x="21" y="206" width="84" height="110" rx="4" fill="#D0DBE6"/><rect x="21" y="206" width="84" height="110" rx="4" fill="url(#hatch)" opacity=".7"/><rect x="24" y="209" width="78" height="104" rx="3" fill="none" stroke="#3A6FB0" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough)"/><g opacity=".55" filter="url(#rough)"><circle cx="63.0" cy="245.6" r="15.400000000000002" fill="#FBFAF6" stroke="#3A6FB0" stroke-width="1.6"/><path d="M38.8 289.6q24.2 -35.2 48.4 0" fill="#FBFAF6" stroke="#3A6FB0" stroke-width="1.6"/></g><text x="63.0" y="309" text-anchor="middle" class="h" font-size="10" fill="#284D7B">插圖待補</text><rect x="47.0" y="199" width="32" height="11" fill="#E8D29B" opacity=".85" transform="rotate(-6 63.0 203)"/><text x="63.0" y="334" text-anchor="middle" class="h" font-size="10.5" fill="#2B5384">＋讀書</text><g filter="url(#rough)"><circle cx="126" cy="217" r="11" fill="#D4DEE8" stroke="#3A6FB0" stroke-width="1.4"/></g><g transform="translate(119,210) scale(.58)" fill="none" stroke="#2E588C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6c3-1.5 6-1.2 9 .6 3-1.8 6-2.1 9-.6v12c-3-1.4-6-1.1-9 .6-3-1.7-6-2-9-.6z"/><path d="M12 6.6v12"/></g><text x="143" y="223" class="t" font-size="16" fill="#33302B">先寫功課</text><text x="115" y="247.5" class="s" font-size="13" fill="#33302B">卡通的片頭曲都響了，你的數學習作還剩最</text><text x="115" y="266.4" class="s" font-size="13" fill="#33302B">後一題。</text><path d="M115 275.35h253" stroke="#3A6FB0" stroke-width="1.3" stroke-dasharray="4 3" opacity=".6"/><path d="M116 285.15v6.0q0 3 3 3h5l-2 -2m2 2l-2 2" stroke="#3A6FB0" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="129" y="294.8" class="h" font-size="12" fill="#5B646F">你學會先把該做的做完；代價是每部卡通都</text><text x="129" y="312.1" class="h" font-size="12" fill="#5B646F">從中間開始看。</text></g><g transform="rotate(0.8 193.0 434.0)"><rect x="5" y="354" width="376" height="160" rx="12" fill="#A8322D" opacity=".26"/><g filter="url(#shadow)"><rect x="10" y="359" width="366" height="150" rx="8" fill="#FBFAF6"/></g><rect x="10" y="359" width="366" height="150" rx="8" fill="none" stroke="#A8322D" stroke-width="3.4" filter="url(#rough)"/><rect x="19" y="368" width="84" height="110" rx="4" fill="#E8CEC9"/><rect x="19" y="368" width="84" height="110" rx="4" fill="url(#hatch)" opacity=".7"/><rect x="22" y="371" width="78" height="104" rx="3" fill="none" stroke="#A8322D" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough)"/><g opacity=".55" filter="url(#rough)"><circle cx="61.0" cy="407.6" r="15.400000000000002" fill="#FBFAF6" stroke="#A8322D" stroke-width="1.6"/><path d="M36.8 451.6q24.2 -35.2 48.4 0" fill="#FBFAF6" stroke="#A8322D" stroke-width="1.6"/></g><text x="61.0" y="471" text-anchor="middle" class="h" font-size="10" fill="#75231F">插圖待補</text><rect x="45.0" y="361" width="32" height="11" fill="#E8D29B" opacity=".85" transform="rotate(-6 61.0 365)"/><text x="61.0" y="496" text-anchor="middle" class="h" font-size="10.5" fill="#7E2521">＋大隊接力</text><g filter="url(#rough)"><circle cx="124" cy="379" r="11" fill="#EAD2CD" stroke="#A8322D" stroke-width="1.4"/></g><g transform="translate(117,372) scale(.58)" fill="none" stroke="#862824" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-7h5l3 7M10 9l2 7h6M9 6h3"/></g><text x="141" y="385" class="t" font-size="16" fill="#33302B">拆掉輔助輪</text><text x="113" y="409.5" class="s" font-size="13" fill="#33302B">拆掉輔助輪那天你摔了好幾次，紅藥水沒乾</text><text x="113" y="428.4" class="s" font-size="13" fill="#33302B">又牽車出門。</text><path d="M113 437.35h253" stroke="#A8322D" stroke-width="1.3" stroke-dasharray="4 3" opacity=".6"/><path d="M114 447.15v6.0q0 3 3 3h5l-2 -2m2 2l-2 2" stroke="#A8322D" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="127" y="456.8" class="h" font-size="12" fill="#76554E">你不太怕跌倒，身體也比較跟得上你想做的</text><text x="127" y="474.1" class="h" font-size="12" fill="#76554E">事。</text><g filter="url(#rough)"><circle cx="362" cy="373" r="11" fill="#A8322D"/><path d="M357 373l4 4l7 -8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></g></g><g transform="rotate(-0.6 195.0 604.0)"><g filter="url(#shadow)"><rect x="12" y="529" width="366" height="150" rx="8" fill="#FBFAF6"/></g><rect x="12" y="529" width="366" height="150" rx="8" fill="none" stroke="#B8902F" stroke-width="2.4" filter="url(#rough)"/><rect x="21" y="538" width="84" height="110" rx="4" fill="#ECE2CA"/><rect x="21" y="538" width="84" height="110" rx="4" fill="url(#hatch)" opacity=".7"/><rect x="24" y="541" width="78" height="104" rx="3" fill="none" stroke="#B8902F" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough)"/><g opacity=".55" filter="url(#rough)"><circle cx="63.0" cy="577.6" r="15.400000000000002" fill="#FBFAF6" stroke="#B8902F" stroke-width="1.6"/><path d="M38.8 621.6q24.2 -35.2 48.4 0" fill="#FBFAF6" stroke="#B8902F" stroke-width="1.6"/></g><text x="63.0" y="641" text-anchor="middle" class="h" font-size="10" fill="#806420">插圖待補</text><rect x="47.0" y="531" width="32" height="11" fill="#E8D29B" opacity=".85" transform="rotate(-6 63.0 535)"/><text x="63.0" y="666" text-anchor="middle" class="h" font-size="10.5" fill="#8A6C23">＋顧店</text><g filter="url(#rough)"><circle cx="126" cy="549" r="11" fill="#EDE4CE" stroke="#B8902F" stroke-width="1.4"/></g><g transform="translate(119,542) scale(.58)" fill="none" stroke="#937325" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l2-5h14l2 5"/><path d="M3 10c0 1.7 1.3 2.5 3 2.5S9 11.7 9 10c0 1.7 1.3 2.5 3 2.5s3-.8 3-2.5c0 1.7 1.3 2.5 3 2.5s3-.8 3-2.5"/><path d="M5 12.5V20h14v-7.5M10 20v-4h4v4"/></g><text x="143" y="555" class="t" font-size="16" fill="#33302B">店裡的小板凳</text><text x="115" y="579.5" class="s" font-size="13" fill="#33302B">放學就坐在店裡的小板凳，客人進門你比大</text><text x="115" y="598.4" class="s" font-size="13" fill="#33302B">人先喊歡迎。</text><path d="M115 607.35h253" stroke="#B8902F" stroke-width="1.3" stroke-dasharray="4 3" opacity=".6"/><path d="M116 617.15v6.0q0 3 3 3h5l-2 -2m2 2l-2 2" stroke="#B8902F" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="129" y="626.8" class="h" font-size="12" fill="#7A6C4F">你比同年紀早學會看場合、算零錢；自己玩</text><text x="129" y="644.1" class="h" font-size="12" fill="#7A6C4F">的時間少一點。</text></g><g filter="url(#shadow)"><rect x="12" y="746" width="366" height="54" rx="10" fill="#A8322D"/></g><rect x="15" y="749" width="360" height="48" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity=".25" stroke-dasharray="5 4" filter="url(#rough)"/><text x="195.0" y="779.48" text-anchor="middle" class="h" font-size="18" fill="#FFFFFF">就是這個</text><text x="14" y="720" class="h" font-size="10.5" fill="#8A5BA8" opacity=".9">幕次＝右上三個圓點；類別＝牌名前的小圓章（不寫數字）</text><text x="14" y="736" class="h" font-size="10.5" fill="#8A5BA8" opacity=".9">點牌＝選取（抬高＋光暈），按鈕才定案；記憶牌圖待補，先用主色佔位框</text><rect width="390" height="844" filter="url(#paper)" pointer-events="none"/><rect width="390" height="47" fill="url(#hatch)"/><text x="195.0" y="28.5" text-anchor="middle" class="s" font-size="11" fill="#66615A">安全區（瀏海／狀態列）</text><rect y="810" width="390" height="34" fill="url(#hatch)"/><rect x="128.0" y="831" width="134" height="5" rx="2.5" fill="#33302B" opacity=".6"/><text x="12" y="831.0" class="s" font-size="11" fill="#66615A">安全區（Home 指示條）</text></svg>