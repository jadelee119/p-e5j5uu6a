<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
<!-- 《台灣人生》時代牌舊電視框｜螢幕透明，牌圖墊在下面｜外框色＝var(--acc)｜art/deck/era/src/gen_tv_frame.py 產生，請改產生器不要手改 -->
<defs>
