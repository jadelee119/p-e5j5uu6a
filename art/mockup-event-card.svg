<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif">
<rect width="560" height="900" fill="#F3EBDD"/>
<rect x="0" y="0" width="560" height="64" fill="#2F4A3E"/>
<text x="24" y="40" fill="#EDEBE3" font-family="Noto Serif CJK TC, serif" font-size="22" font-weight="700">民國 81 年・1 歲</text>
<text x="536" y="40" fill="#EDEBE3" font-size="14" text-anchor="end" opacity=".8">幼兒期 1/2</text>
<g font-size="12" fill="#3A3229">
 <text x="24" y="92">學業</text><rect x="60" y="83" width="100" height="8" fill="none" stroke="#4E6A73"/><rect x="60" y="83" width="20" height="8" fill="#4E6A73"/>
 <text x="196" y="92">快樂</text><rect x="232" y="83" width="100" height="8" fill="none" stroke="#4E6A73"/><rect x="232" y="83" width="60" height="8" fill="#5E8C4A"/>
 <text x="368" y="92">壓力</text><rect x="404" y="83" width="100" height="8" fill="none" stroke="#4E6A73"/><rect x="404" y="83" width="10" height="8" fill="#B5443A"/>
</g>
<g transform="translate(24,112)">
 <rect width="512" height="760" rx="6" fill="#FFFBF2" stroke="#E2D7C3"/>
 <g stroke="#A9C4D9" stroke-width="1" opacity=".6">
  <line x1="0" y1="380" x2="512" y2="380"/><line x1="0" y1="408" x2="512" y2="408"/><line x1="0" y1="436" x2="512" y2="436"/><line x1="0" y1="464" x2="512" y2="464"/><line x1="0" y1="492" x2="512" y2="492"/><line x1="0" y1="520" x2="512" y2="520"/>
 </g>
 <line x1="28" y1="0" x2="28" y2="760" stroke="#B5443A" stroke-width="1.2" opacity=".5"/>
 <g transform="translate(96,24) rotate(-2)">
  <rect width="320" height="300" fill="#fff" stroke="#E2D7C3"/>
  <rect x="14" y="14" width="292" height="232" fill="#B5443A"/>
  <circle cx="160" cy="140" r="34" fill="#F5D9BF" stroke="#3A3229" stroke-width="2"/>
  <circle cx="148" cy="136" r="2.5" fill="#3A3229"/><circle cx="172" cy="136" r="2.5" fill="#3A3229"/>
  <path d="M152 152 q8 6 16 0" stroke="#3A3229" stroke-width="2" fill="none"/>
  <line x1="50" y1="60" x2="100" y2="80" stroke="#3A3229" stroke-width="4"/>
  <rect x="220" y="56" width="60" height="22" fill="#E8D29B" stroke="#3A3229"/>
  <path d="M60 200 q20 -30 40 0" stroke="#EDEBE3" stroke-width="3" fill="none"/><circle cx="60" cy="200" r="6" fill="#EDEBE3"/>
  <rect x="210" y="190" width="40" height="30" fill="#EDEBE3" stroke="#3A3229"/>
  <rect x="120" y="210" width="40" height="22" fill="#A9C4D9" stroke="#3A3229"/>
  <text x="160" y="282" text-anchor="middle" font-size="15" fill="#3A3229">一歲，紅布上的你，手裡抓著未來。</text>
  <rect x="130" y="-10" width="70" height="22" fill="#E8D29B" opacity=".75" transform="rotate(4 165 0)"/>
 </g>
 <text x="48" y="366" font-family="Noto Serif CJK TC, serif" font-size="26" font-weight="700" fill="#3A3229">抓周</text>
 <g font-size="16" fill="#3A3229">
  <text x="48" y="402">週歲那天，紅布上擺著毛筆、算盤、聽診器、計算機和</text>
  <text x="48" y="430">一張悠遊卡。全家人屏住呼吸，彷彿你接下來的一抓，</text>
  <text x="48" y="458">決定了這個家未來二十年的退休規劃。</text>
 </g>
 <g font-size="16" fill="#3A3229">
  <rect x="48" y="500" width="416" height="52" rx="4" fill="#fff" stroke="#3A3229"/><rect x="64" y="518" width="16" height="16" fill="none" stroke="#3A3229"/>
  <path d="M64 524 l6 8 l14 -18" stroke="#B5443A" stroke-width="3" fill="none"/><text x="96" y="532">抓聽診器</text>
  <rect x="48" y="566" width="416" height="52" rx="4" fill="#fff" stroke="#3A3229"/><rect x="64" y="584" width="16" height="16" fill="none" stroke="#3A3229"/><text x="96" y="598">抓悠遊卡</text>
  <rect x="48" y="632" width="416" height="74" rx="4" fill="#F7F2E8" stroke="#BDB4A5" stroke-dasharray="5 4"/><rect x="64" y="650" width="16" height="16" fill="none" stroke="#BDB4A5"/><text x="96" y="664" fill="#BDB4A5">去抓阿公手上的雞腿</text>
  <text x="96" y="692" font-size="13" fill="#B5443A">需要關係 ≥ 50：阿公得坐在你旁邊才行</text>
 </g>
</g>
</svg>
